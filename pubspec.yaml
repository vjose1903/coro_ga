name: game_score
description: Aplicación para anotar puntuaciones de juegos favoritos.

publish_to: "none"

version: 6.0.3+63

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  firebase_core: ^4.4.0
  firebase_analytics: ^12.1.1
  firebase_crashlytics: ^5.0.0
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.12.0
  flutter_swipe_action_cell: ^3.1.3
  provider: ^6.1.2
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  toastification: ^3.0.3
  scrollable_positioned_list: ^0.3.8
  loading_animation_widget: ^1.3.0
  reactive_forms: ^18.2.2
  animate_do: ^4.2.0
  lottie: ^3.3.1
  widget_and_text_animator: ^1.1.5
  shared_preferences: ^2.5.2
  sliding_up_panel2: ^3.3.0+1
  google_mobile_ads: ^7.0.0
  animations: ^2.1.1
  fluid_dialog: ^2.0.0
  reorderables: ^0.6.0
  flutter_shake_animated: ^0.0.5
  auto_size_text: ^3.0.0
  flutter_easyloading: ^3.0.5
  package_info_plus: ^9.0.0
  in_app_purchase: ^3.2.0
  url_launcher: ^6.3.1
  in_app_review: ^2.0.11
  path: ^1.9.1
  fluttertoast: ^8.2.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# 👇 CONFIGURACIÓN DE ICONOS (OBLIGATORIA PARA iOS)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  image_path_ios_dark_transparent: "assets/icon/icon-dark.png"
  image_path_ios_tinted_grayscale: "assets/icon/icon-tinted.png"
  desaturate_tinted_to_grayscale_ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icon/rectangle.png"
  adaptive_icon_foreground: "assets/icon/iconCircular.png"
  adaptive_icon_monochrome: "assets/icon/icon-monochromed.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/img/
    - assets/icon/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
