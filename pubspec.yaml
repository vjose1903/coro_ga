name: game_score
description: A new Flutter project.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_custom_clippers: ^2.1.0
  font_awesome_flutter: ^10.8.0
  flutter_swipe_action_cell: ^3.1.3
  provider: ^6.1.2
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  motion_toast: ^2.11.1
  scrollable_positioned_list: ^0.3.8
  loading_animation_widget: ^1.3.0
  reactive_forms: ^17.0.1
  animate_do: ^3.3.4
  lottie: ^3.3.1
  widget_and_text_animator: ^1.1.5
  shared_preferences: ^2.5.2
  flutter_sliding_up_panel: ^2.1.1
  google_mobile_ads: ^7.0.0
  shimmer: ^3.0.0
  animations: ^2.0.11
  reorderables: ^0.6.0
  flutter_shake_animated: ^0.0.5
  auto_size_text: ^3.0.0
  flutter_easyloading: ^3.0.5
  package_info_plus: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/img/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
